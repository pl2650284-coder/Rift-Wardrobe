<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Logo 与命名方案</title>
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-2: #f4f5f7;
    --line: rgba(15, 23, 42, 0.09);
    --line-strong: rgba(15, 23, 42, 0.16);
    --ink: #111318;
    --muted: #5b6272;
    --accent: #2d55d6;
    --icon-bg: #14171f;
    --icon-fg: #f5f7fa;
  }
  [data-theme="dark"] {
    --bg: #0f1115;
    --surface: #15181f;
    --surface-2: #1c202a;
    --line: rgba(255, 255, 255, 0.08);
    --line-strong: rgba(255, 255, 255, 0.16);
    --ink: #f2f4f8;
    --muted: #9aa2b3;
    --icon-bg: #1e222d;
    --icon-fg: #f5f7fa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei UI", "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    padding: 28px 36px 36px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 18px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--line);
    gap: 16px;
  }
  .top h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  .controls { display: flex; align-items: center; gap: 10px; }
  .swatches { display: flex; gap: 7px; align-items: center; }
  .sw {
    width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
  }
  .sw.on { border-color: var(--ink); }
  .btn {
    height: 32px; padding: 0 12px; border-radius: 7px;
    border: 1px solid var(--line-strong); background: var(--surface);
    color: var(--ink); font: inherit; font-size: 12px; cursor: pointer;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }
  .badge {
    font-size: 12px;
    color: var(--muted);
    padding: 2px 9px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--line);
  }
  .title-block h2 {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.02em;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .title-block h2 span { font-size: 14px; font-weight: 500; color: var(--muted); }
  .title-block p { margin-top: 6px; font-size: 13px; color: var(--muted); }

  .preview-stage {
    display: grid;
    grid-template-columns: 112px 1fr;
    gap: 20px;
    align-items: center;
    padding: 18px;
    border-radius: 12px;
    background: var(--surface-2);
    border: 1px solid var(--line);
  }
  .hero-icon {
    width: 96px;
    height: 96px;
    display: grid;
    place-items: center;
    margin: 0 auto;
    filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.14));
  }
  .sizes {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .size-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .size-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .lockup {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    border-radius: 9px;
    background: var(--surface);
    border: 1px solid var(--line);
    width: fit-content;
  }
  .lockup strong { font-size: 15px; font-weight: 600; color: var(--ink); }
  .lockup span { font-size: 12px; color: var(--muted); }

  .alt-names {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--muted);
  }
  .alt-chip {
    padding: 3px 9px;
    border-radius: 6px;
    background: var(--surface-2);
    color: var(--ink);
  }

  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>App 名称与极简 Logo 方案</h1>
      <div class="controls">
        <div class="swatches" aria-label="测试强调色">
          <button class="sw on" style="background:#2d55d6" data-c="#2d55d6" title="清蓝"></button>
          <button class="sw" style="background:#059669" data-c="#059669" title="薄荷"></button>
          <button class="sw" style="background:#b4346c" data-c="#b4346c" title="绯红"></button>
          <button class="sw" style="background:#c48a2a" data-c="#c48a2a" title="暖金"></button>
        </div>
        <button id="themeToggle" class="btn">切换深色</button>
      </div>
    </header>

    <main id="grid" class="grid"></main>
  </div>

  <script>
    let accent = "#2d55d6";

    const PROPOSALS = [
      {
        key: "A",
        zh: "轻峡",
        en: "Rift",
        tag: "最贴合英雄联盟 · 极简河道隐喻",
        desc: "以召唤师峡谷的 45° 对角河道为原型，把圆角方块切成红蓝半区，右上点亮一枚克制坐标点。玩家一眼秒懂，桌面观感极其干净。",
        alts: ["峡光", "简峡", "Riftly"],
        svg: (c, size) => `
          <svg width="${size}" height="${size}" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="128" height="128" rx="30" fill="#14171F"/>
            <path d="M30 84V36C30 32.686 32.686 30 36 30H84L30 84Z" fill="#F3F5F9"/>
            <path d="M98 44V92C98 95.314 95.314 98 92 98H44L98 44Z" fill="${c}"/>
            <circle cx="84" cy="44" r="7" fill="#14171F" stroke="#F3F5F9" stroke-width="3.5"/>
          </svg>`
      },
      {
        key: "B",
        zh: "侧翼",
        en: "Sidecar",
        tag: "最贴合伴随小窗形态 · 效率工具感",
        desc: "左侧为游戏主窗口轮廓，右侧紧贴一条高亮独立小窗，直接表达“不遮挡游戏、静静停在侧边辅助”的产品形态。",
        alts: ["伴翼", "旁窗", "Wing"],
        svg: (c, size) => `
          <svg width="${size}" height="${size}" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="128" height="128" rx="30" fill="#14171F"/>
            <rect x="24" y="30" width="52" height="68" rx="10" stroke="#F3F5F9" stroke-width="7"/>
            <rect x="86" y="30" width="18" height="68" rx="9" fill="${c}"/>
          </svg>`
      },
      {
        key: "C",
        zh: "棱镜",
        en: "Hexa",
        tag: "海克斯 + 换肤多面性 · 几何高级感",
        desc: "极简正六边形与单条斜切光面，同时呼应海克斯（Hex）、皮肤多面切换与数据透视，去除了传统游戏图标的厚重浮雕感。",
        alts: ["折光", "六面", "Prism"],
        svg: (c, size) => `
          <svg width="${size}" height="${size}" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="128" height="128" rx="30" fill="#14171F"/>
            <path d="M64 24L98 44V84L64 104L30 84V44L64 24Z" stroke="#F3F5F9" stroke-width="7" stroke-linejoin="round"/>
            <path d="M64 24L98 44V84L64 64V24Z" fill="${c}"/>
          </svg>`
      },
      {
        key: "D",
        zh: "序幕",
        en: "Cue",
        tag: "选人开局仪式感 · 短小好记",
        desc: "每一局从选人开始。图标用极简方框里的精准菱形焦点表现“锁定出场、一键切换”，16×16 托盘和 32×32 侧栏下都极锐利。",
        alts: ["登场", "开局", "Latch"],
        svg: (c, size) => `
          <svg width="${size}" height="${size}" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="128" height="128" rx="30" fill="#14171F"/>
            <path d="M64 24L96 64L64 104L32 64L64 24Z" fill="#F3F5F9"/>
            <path d="M64 46L78 64L64 82L50 64L64 46Z" fill="${c}"/>
          </svg>`
      }
    ];

    function render() {
      document.getElementById("grid").innerHTML = PROPOSALS.map(p => `
        <article class="card">
          <div class="card-head">
            <div class="title-block">
              <h2>${p.zh} <span>${p.en}</span></h2>
              <p>${p.desc}</p>
            </div>
            <span class="badge">方案 ${p.key}</span>
          </div>

          <div class="preview-stage">
            <div class="hero-icon">${p.svg(accent, 92)}</div>
            <div class="sizes">
              <div class="lockup">
                ${p.svg(accent, 28)}
                <strong>${p.zh}</strong>
                <span>${p.en}</span>
              </div>
              <div class="size-row">
                <div class="size-item">${p.svg(accent, 36)}<span>36px 侧栏</span></div>
                <div class="size-item">${p.svg(accent, 24)}<span>24px 窗口</span></div>
                <div class="size-item">${p.svg(accent, 16)}<span>16px 托盘</span></div>
              </div>
            </div>
          </div>

          <div class="alt-names">
            <span>同方向备选名：</span>
            ${p.alts.map(n => `<span class="alt-chip">${n}</span>`).join("")}
            <span style="margin-left:auto">${p.tag}</span>
          </div>
        </article>
      `).join("");
    }

    document.querySelectorAll("[data-c]").forEach(btn => {
      btn.addEventListener("click", () => {
        accent = btn.dataset.c;
        document.querySelectorAll("[data-c]").forEach(b => b.classList.toggle("on", b === btn));
        render();
      });
    });

    const toggle = document.getElementById("themeToggle");
    toggle.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
      document.documentElement.dataset.theme = next;
      toggle.textContent = next === "light" ? "切换深色" : "切换浅色";
    });

    render();
  </script>
</body>
</html>
