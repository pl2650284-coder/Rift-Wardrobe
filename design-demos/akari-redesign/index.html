</style></head><body><header><div class="head"><div><h1>同一套功能，三种空间关系。</h1><p>此前的功能融合初稿。<a href="minimal/index.html">打开新版战绩原型</a></p></div><a href="thumbs.html">六个候选方向</a></div><nav role="tablist" aria-label="选择原型方向"><button id="a" role="tab" aria-selected="true" data-v="a"><strong>A　连续画布</strong><span>顶部导航 / 青绿深色 / 弱分隔</span></button><button id="b" role="tab" aria-selected="false" data-v="b"><strong>B　侧栏工作台</strong><span>浅色界面 / 文字侧栏 / 任务与详情</span></button><button id="c" role="tab" aria-selected="false" data-v="c"><strong>C　聚焦对局</strong><span>石墨深色 / 原画与阵容并排 / 暖杏点缀</span></button></nav></header><div class="frame" role="tabpanel" aria-labelledby="a"><iframe title="A 连续画布交互预览" src="dir-a.html"></iframe></div><footer><span>原型演示数据 · 所有游戏操作均为本地模拟</span><a id="open" href="dir-a.html" target="_blank" rel="noopener">单独打开当前方向 ↗</a></footer><script>
const buttons=[...document.querySelectorAll('[data-v]')];function select(b){for(const x of buttons){x.setAttribute('aria-selected',String(x===b));x.tabIndex=x===b?0:-1}document.querySelector('iframe').src=`dir-${b.dataset.v}.html`;document.querySelector('iframe').title=b.textContent+'交互预览';document.querySelector('.frame').setAttribute('aria-labelledby',b.id);document.querySelector('#open').href=`dir-${b.dataset.v}.html`}buttons.forEach((b,i)=>{b.onclick=()=>select(b);b.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const n=e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:2))%3;select(buttons[n]);buttons[n].focus()}}});
</script></body></html>
